name: Public release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check explicit public files and actual Git index
        run: python3 -B scripts/check_publication.py --staged
      - name: Run standard-library tests
        run: python3 -B -m unittest discover -s tests/public -v
      - name: Build and verify the public-only archive
        run: python3 -B scripts/build_release.py
